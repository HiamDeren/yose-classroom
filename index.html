<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Yose Home · Kho kiến thức tiếng Anh</title>
  <meta name="description" content="Tổng hợp từ vựng, cấu trúc, ngữ pháp và bài nói mẫu theo từng buổi học tại Yose Home.">
  <meta name="theme-color" content="#E0663F">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <script>
    // áp dụng theme sớm để tránh nháy màu
    try { var t = localStorage.getItem("yose-theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="#/" aria-label="Yose Home – Trang chủ">
        <svg class="brand-logo" viewBox="0 0 40 40" aria-hidden="true">
          <rect width="40" height="40" rx="11" fill="var(--brand)"/>
          <path d="M9 19.5 20 10l11 9.5V30a1.5 1.5 0 0 1-1.5 1.5h-5.5v-7h-8v7H10.5A1.5 1.5 0 0 1 9 30z" fill="#fff"/>
          <circle cx="20" cy="19" r="2.4" fill="var(--brand)"/>
        </svg>
        <span class="brand-text"><b>Yose</b> Home</span>
      </a>
      <nav class="nav" aria-label="Điều hướng chính">
        <a href="#/" data-nav="home">Trang chủ</a>
        <a href="#/tu-dien" data-nav="dict">Từ điển</a>
        <div class="nav-lessons" id="navLessons"></div>
      </nav>
      <button class="search-trigger" id="openSearch" type="button" aria-label="Tìm nhanh">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <span class="search-trigger-text">Tìm từ nhanh…</span>
        <kbd>/</kbd>
      </button>
      <button class="icon-btn" id="themeToggle" type="button" aria-label="Đổi giao diện sáng/tối">
        <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
    </div>
  </header>

  <main id="app" class="container" tabindex="-1"></main>

  <footer class="footer">
    <div class="container footer-inner">
      <span><b>Yose Home</b> · Kho kiến thức tiếng Anh của khóa học</span>
      <span class="muted">Mẹo: nhấn <kbd>/</kbd> để tìm từ nhanh ở bất kỳ trang nào</span>
    </div>
  </footer>

  <!-- Hộp tìm nhanh -->
  <div class="palette" id="palette" hidden>
    <div class="palette-backdrop" data-close></div>
    <div class="palette-panel" role="dialog" aria-modal="true" aria-label="Tìm nhanh">
      <div class="palette-head">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="paletteInput" type="search" placeholder="Gõ từ tiếng Anh hoặc nghĩa tiếng Việt…" autocomplete="off" spellcheck="false">
        <button class="esc" type="button" data-close>Esc</button>
      </div>
      <div class="palette-body" id="paletteResults"></div>
      <div class="palette-foot"><span><kbd>↑</kbd><kbd>↓</kbd> chọn</span><span><kbd>Enter</kbd> mở</span><span><kbd>Esc</kbd> đóng</span></div>
    </div>
  </div>

  <script>
    window.YOSE = {
      lessons: [], homework: {},
      addLesson: function (l) { this.lessons.push(l); },
      addHomework: function (id, list) { this.homework[id] = list; }
    };
  </script>
  <!-- Dữ liệu từng buổi: thêm buổi mới bằng một dòng script ở đây -->
  <script src="data/lesson-01.js"></script>
  <script src="data/lesson-02.js"></script>
  <script src="data/lesson-03.js"></script>
  <script src="data/lesson-04.js"></script>
  <script src="data/lesson-05.js"></script>

  <!-- Bài tập từng buổi -->
  <script src="data/homework-01.js"></script>
  <script src="data/homework-02.js"></script>
  <script src="data/homework-03.js"></script>
  <script src="data/homework-04.js"></script>
  <script src="data/homework-05.js"></script>

  <script src="assets/js/app.js"></script>
</body>
</html>
